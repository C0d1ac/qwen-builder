name: Build Qwen NVFP4 Parts

on:
  workflow_dispatch:
  push:
    paths:
      - 'split-dockerfiles/**'
      - '.github/workflows/build-qwen.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/c0d1ac/qwen-nvfp4

jobs:
  build-part:
    name: Build part ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build part ${{ matrix.part }}
        run: |
          docker build \
            --build-arg HF_TOKEN='${{ secrets.HF_TOKEN }}' \
            -f "split-dockerfiles/Dockerfile.part${{ matrix.part }}" \
            -t "${IMAGE_NAME}:part${{ matrix.part }}" .

      - name: Push part ${{ matrix.part }}
        run: docker push "${IMAGE_NAME}:part${{ matrix.part }}"
