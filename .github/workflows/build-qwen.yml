name: Build Qwen Model Parts

on:
  workflow_dispatch:
  push:
    paths:
      - 'split-dockerfiles/**'
      - '.github/workflows/build-qwen.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-part1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build part 1
        run: docker build --build-arg HF_TOKEN=${{ secrets.HF_TOKEN }} -f split-dockerfiles/Dockerfile.part1 -t ghcr.io/c0d1ac/qwen-flash-next-part1:latest .
      - name: Push part 1
        run: docker push ghcr.io/c0d1ac/qwen-flash-next-part1:latest

