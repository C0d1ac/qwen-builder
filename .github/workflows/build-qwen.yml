name: Build Qwen Model Parts

on:
  workflow_dispatch:
  push:
    paths:
      - 'split-dockerfiles/**'
      - '.github/workflows/build-qwen.yml'

permissions:
  contents: read
  packages: write

jobs:

  build-fp8-chunk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: '000'
            start: '0'
            end: '7673935961'
            size: '7673935962'
          - index: '001'
            start: '7673935962'
            end: '15347871923'
            size: '7673935962'
          - index: '002'
            start: '15347871924'
            end: '23021807885'
            size: '7673935962'
          - index: '003'
            start: '23021807886'
            end: '30695743847'
            size: '7673935962'
          - index: '004'
            start: '30695743848'
            end: '38369679809'
            size: '7673935962'
          - index: '005'
            start: '38369679810'
            end: '46043615771'
            size: '7673935962'
          - index: '006'
            start: '46043615772'
            end: '53717551729'
            size: '7673935958'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push FP8 chunk ${{ matrix.index }}
        run: |
          docker build \
            --build-arg CHUNK_INDEX='${{ matrix.index }}' \
            --build-arg RANGE_START='${{ matrix.start }}' \
            --build-arg RANGE_END='${{ matrix.end }}' \
            --build-arg CHUNK_SIZE='${{ matrix.size }}' \
            -f split-dockerfiles/Dockerfile.fp8-chunk \
            -t ghcr.io/c0d1ac/qwen-flash-fp8-chunk:${{ matrix.index }} .
          docker push ghcr.io/c0d1ac/qwen-flash-fp8-chunk:${{ matrix.index }}
